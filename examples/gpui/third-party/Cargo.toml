[workspace]

[package]
# Pseudo-package whose dependencies reindeer turns into Buck targets.
name = "rust-third-party"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "top"
path = "top/main.rs"

[dependencies]
# zed-xim, of gpui, needs a default `ahash::RandomState`. It turns on `compile-time-rng`, which
# fixups/ahash turns off; this seeds it at run time instead.
ahash = { version = "0.8", features = ["runtime-rng"] }
futures = "0.3"
gpui = "0.2.2"
# libc 0.2.190 takes away `ENOATTR` on Linux, which xattr 0.2, of gpui's HTTP client, uses.
libc = "=0.2.189"
serde_json = "1"
subsecond = "0.7"
