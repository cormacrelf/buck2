syntax = "proto3";

package buck.subscription;

// Client-to-daemon interaction in a subscription. This is what the client
// writes to `stdin` of the `subscribe` command.
message SubscriptionRequest {
  reserved 2, 3;
  reserved "subscribe_to_paths", "unsubscribe_from_paths";

  // The actual request. See documentation of the underlying types for details.
  oneof request {
    Disconnect disconnect = 1;
    SubscribeToActiveCommands subscribe_to_active_commands = 4;
    SubscribeToFileChanges subscribe_to_file_changes = 5;
  }
}

// The client would like to gracefully disconnect. This will result in the
// command exiting.
message Disconnect {
  string reason = 1;
  // Indicate whether this disconnect sould be considered a success or not.
  bool ok = 2;
}

message SubscribeToActiveCommands {}

// Ask for the changes that the daemon's file watcher sees in the project, as it
// sees them. The daemon answers with an empty `FileChanges`, and then sends
// one for each batch of changes. If the file watcher cannot report changes as
// they happen, the command fails. Every change sent is also seen by the next
// command that the daemon runs.
message SubscribeToFileChanges {}

// Daemon to client interaction in a subscription. This is what the client will
// receive via the `stdout` of the `subscribe` command.
message SubscriptionResponse {
  reserved 1;
  reserved "materialized";

  // The actual response. See documentation of the underlying types for details.
  oneof response {
    ActiveCommandsSnapshot active_commands_snapshot = 2;
    Goodbye goodbye = 3;
    FileChanges file_changes = 4;
  }
}

// Changes to files in the project. See `SubscribeToFileChanges`.
message FileChanges {
  repeated FileChange changes = 1;
  // Changes were missed, by the file watcher or because the client fell
  // behind: anything in the project may have changed.
  bool missed = 2;
}

message FileChange {
  // Relative to the project root.
  string path = 1;
  FileChangeKind kind = 2;
}

enum FileChangeKind {
  // The contents or metadata of a file changed.
  CONTENTS = 0;
  // A file was added or removed, or renamed, which is both.
  FILE_ADDED_OR_REMOVED = 1;
  // A directory was added or removed, or renamed.
  DIR_ADDED_OR_REMOVED = 2;
}

message ActiveCommandsSnapshot {
  repeated ActiveCommand active_commands = 1;
}

message ActiveCommand {
  string trace_id = 1;
  repeated string argv = 2;
  ActiveCommandStats stats = 3;
}

message ActiveCommandStats {
  /// Spans currently executing.
  uint64 open_spans = 1;
  /// Spans that have finished executing.
  uint64 closed_spans = 2;
  /// Spans that are expected to have to open (then close) before the command
  /// finishes.
  uint64 pending_spans = 3;
}

/// This notification is sent by the daemon when closing the connection.
message Goodbye {
  string reason = 1;

  // Indicates whether the daemon thinks this command was successful or not.
  // This is largely just echoing what Disconnect requested.
  bool ok = 2;
}
